home-slide-apps:
  other: Beside the core desktop functionality, a number of other applications are developed in the Xfce repositories, like an image viewer, task manager, notes plugin and calendar.
home-slide-desktop:
  other: The default Xfce Desktop provides a simple and attractive desktop for Unix users.
home-slide-panel:
  other: The Xfce Panel can be customized in numerous ways so it provides all the items you need right where you need them. It has three different display modes, transparency and a few dozen different plugins.
home-slide-settings:
  other: The Xfce Desktop provides all the required settings to configure your hardware, desktop appearance and other desktop-critical settings allowing you to easily manage your system.
home-slide-xfwm:
  other: The Xfce Window Manager is the core of the desktop. It can be tuned to make window management quick and predictable. It also features around 100 border styles giving it the look you want!
