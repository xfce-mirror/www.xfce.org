stages:
  - .pre
  - build
  - sync

variables:
  BUILD_IMAGE: "index.docker.io/xfce/www-xfce-org:latest"

build:
  stage: build
  image: $BUILD_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
  script:
    - ./build.sh --update-po
  artifacts:
    paths:
      - public/
      - po/strings.pot
      - po/content.pot
    expire_in: 1 day

tx-push:
  stage: sync
  image: $BUILD_IMAGE
  needs: [build]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      changes:
        - i18n/en.yaml
        - content/**/*.md
  script:
    # Without a terminal, tx cuts every line at 80 characters, error messages
    # included. --silent prints only errors, and prints them in full.
    - tx push --source --silent

tx-pull:
  stage: sync
  image: $BUILD_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - ./scripts/tx-pull.sh

build-image:
  stage: .pre
  image: docker:29
  services:
    - docker:29-dind
  variables:
    CI_REGISTRY: "docker.io"
    DOCKER_TLS_CERTDIR: "/certs"
    # Set secrets in project environment variables as follows:
    # CI_REGISTRY_USER=your_user
    # CI_REGISTRY_PASSWORD=********
  rules:
    - if: '$CI_PROJECT_PATH == "www/www.xfce.org" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - Dockerfile
  script:
    - docker build -t $BUILD_IMAGE .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $BUILD_IMAGE
