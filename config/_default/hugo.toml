baseURL = "https://www.xfce.org/"
title = "Xfce Desktop Environment"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = false
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[params]
  staticMedia = "//cdn.xfce.org"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
    isPlainText = false

[services]
  [services.rss]
    limit = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandaloneImageWithinParagraph = false

# hugo-gettext generates translated content into generated/{lang}/.
# Each language needs its own lang-scoped mount so Hugo assigns pages
# to the correct language. Add a new entry when adding a language.

[[module.mounts]]
  source = "content"
  target = "content"
  lang = "en"

